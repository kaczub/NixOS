[nightlight]
enabled = true
temperature_day = 6600
temperature_night = 3200

[notification]
background_opacity = 0.69999998435378075

[osd]
background_opacity = 0.69999998435378075

[plugins]
enabled = [ "noctalia/bitwarden", "weinguyen/opencode-companion" ]

[shell]
app_icon_color = "primary"
corner_radius_scale = 0.0
font_family = "JetBrainsMono Nerd Font"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
settings_show_advanced = false
settings_window_translucent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    clipboard_placement = "attached"
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

[theme]
builtin = "Ayu"
community_palette = "ADW"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    enable_builtin_templates = true
    enable_community_templates = true
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "kitty", "niri" ]
    community_ids = [ "discord", "libreoffice", "neovim", "zed", "prismlauncher", "steam", "fzf" ]

[widget.audio_visualizer]
bands = 10
show_wave = true

[widget.battery]
display_mode = "none"

[widget.media]
hide_album_art = true
hide_artist = true
hide_when_no_media = true
max_length = 200
title_scroll = "always"

[widget.network]
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.tray]
enabled = false
